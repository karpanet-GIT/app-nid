<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il mio portafoglio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#18213A; --muted:#5A6378; --line:#E3E7EE;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --gain:#17804F; --loss:#C0362C; --neutral:#E2E6EE; --warn:#9A5B00; --warn-bg:#FFF4DF;
  --logo-bg:transparent; --logo-pad:0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1321; --surface:#151E31; --surface2:#1A253C; --ink:#E6EAF2; --muted:#97A1B5; --line:#27324A;
    --accent:#7396FF; --accent-ink:#0D1321; --gain:#3EC07F; --loss:#FF6E61; --neutral:#212C44; --warn:#FFC266; --warn-bg:#2E2614;
    --logo-bg:#FFFFFF; --logo-pad:3px 6px;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1321; --surface:#151E31; --surface2:#1A253C; --ink:#E6EAF2; --muted:#97A1B5; --line:#27324A;
  --accent:#7396FF; --accent-ink:#0D1321; --gain:#3EC07F; --loss:#FF6E61; --neutral:#212C44; --warn:#FFC266; --warn-bg:#2E2614;
  --logo-bg:#FFFFFF; --logo-pad:3px 6px;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.up{color:var(--gain)} .down{color:var(--loss)} .flat{color:var(--muted)}
small{font-size:12.5px;color:var(--muted)}

/* barra superiore */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:700;margin:0;margin-right:auto;letter-spacing:-.01em}
.top h1.logo{line-height:0}
.top h1.logo img{height:52px;width:auto;display:block;background:var(--logo-bg);border-radius:8px;padding:var(--logo-pad)}
.ranges{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
.ranges button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.ranges button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--loss)}
.btn.danger.armed{background:var(--loss);border-color:var(--loss);color:#fff}
.btn.small{padding:5px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

/* riepilogo */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:28px;align-items:end;margin-bottom:18px}
.total-label{font-size:14px;color:var(--muted);margin:0 0 2px}
.total{font-size:clamp(34px,5.4vw,52px);font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:11px 14px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.kpi .v{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:13px;font-weight:600}

.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{color:inherit}

/* mappa */
.map{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.tile{flex-shrink:1;min-width:128px;min-height:92px;border:0;border-radius:8px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--tbg);color:var(--tfg);transition:transform .12s}
.tile:hover{transform:translateY(-1px)}
.t-name{font-size:13px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t-var{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:6px;white-space:nowrap}
.t-pl{font-size:12.5px;opacity:.85}
.alloc{margin:14px 0 26px}
.alloc-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.alloc-bar span{display:block;height:100%}
.alloc-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:9px;font-size:13.5px}
.alloc-leg span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.alloc-leg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.alloc-leg b{color:var(--ink);font-weight:600}

/* pannelli */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:22px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.card-h h2{font-size:16px;margin:0;font-weight:700}
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart-empty{display:flex;align-items:center;justify-content:center;text-align:center;min-height:150px;color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:10px}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translateX(-50%);line-height:1.35;z-index:2}
.tip b{font-weight:700}

/* categorie */
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.cat-h{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 14px;padding:13px 18px;border-left:5px solid var(--cat);background:var(--surface2)}
.cat-h h2{margin:0;font-size:16px;font-weight:700}
.cat-h .cat-val{font-size:17px;font-weight:700;text-align:right}
.cat-h .cat-sub{grid-column:2/4;display:flex;gap:18px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.cat-h .cat-sub small{font-weight:500}
.cat-dot{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.row{display:grid;grid-template-columns:minmax(0,2.3fr) .8fr .9fr .95fr 1fr 1.05fr 1.05fr 96px;gap:12px;align-items:center;padding:11px 18px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:right;font-size:14px}
button.row:hover{background:var(--surface2)}
.row.head{font-size:12.5px;color:var(--muted);padding-top:8px;padding-bottom:8px}
.row>span{min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.row .c-name{align-items:flex-start;text-align:left}
.row .c-name b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.row .c-per,.row .c-tot{font-weight:600}
.row .c-per small,.row .c-tot small{color:inherit;opacity:.85;font-weight:500}
.need{font-style:normal;font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:1px 6px;margin-top:3px}
.partial{color:var(--muted);font-weight:500}
body.range-carico .c-per{display:none}
body.range-carico .row{grid-template-columns:minmax(0,2.3fr) .8fr .9fr .95fr 1fr 1.05fr 96px}
.spark{width:96px;height:30px;display:block}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin:0 0 6px}
.foot{color:var(--muted);font-size:13px;margin-top:28px;max-width:72ch}

/* dialoghi */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(10,18,40,.28)}
dialog::backdrop{background:rgba(10,16,32,.45)}
.dlg-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 10px;position:sticky;top:0;background:var(--surface);z-index:3}
.dlg-h h2{margin:0;font-size:19px;line-height:1.25}
.dlg-h .x{margin-left:auto;border:0;background:var(--surface2);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1;flex-shrink:0}
.dlg-b{padding:4px 20px 20px}
.d-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.d-stats div{background:var(--surface2);border-radius:10px;padding:9px 11px}
.d-stats .k{font-size:12px;color:var(--muted)}
.d-stats .v{font-size:16px;font-weight:700}
.d-stats .s{font-size:12.5px;font-weight:600}
.dlg-b .ranges{margin-bottom:10px;width:max-content}
.note{font-size:13px;color:var(--muted);margin:8px 0 14px}
.panel{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface2)}
.panel h3{margin:0 0 8px;font-size:15px}
.panel p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink);width:100%}
textarea{min-height:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.bankbox{grid-column:1/-1;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px}
.err{color:var(--loss);font-size:13.5px;min-height:1em;margin:8px 0 0}
.ok{color:var(--gain);font-size:13.5px;margin:8px 0 0}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:0 20px 18px;flex-wrap:wrap}
.bulk{display:grid;grid-template-columns:1fr 150px;gap:8px 12px;align-items:center}
.bulk .n{font-size:14px;line-height:1.25}
.bi{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bi .chg{font-size:12px;font-weight:600;white-space:nowrap}
.bulk input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%;text-align:right}
.menu{position:relative}
#btnTheme{font-size:16px;line-height:1;padding:7px 11px}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:200px;box-shadow:0 10px 30px rgba(10,18,40,.18);display:none;z-index:30}
.menu.open .menu-pop{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:14px}
.menu-pop button:hover{background:var(--surface2)}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .top-in{padding:9px 14px}
  .top h1.logo img{height:44px}
  main{padding:16px 12px 50px}
  .row,body.range-carico .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n v" "p t";gap:4px 10px;padding:11px 14px}
  .row .c-name{grid-area:n} .row .c-val{grid-area:v;font-weight:700}
  .row .c-per{grid-area:p;flex-direction:row;gap:8px;align-items:baseline;justify-content:flex-start}
  .row .c-tot{grid-area:t;flex-direction:row;gap:8px;align-items:baseline}
  body.range-carico .row .c-tot{grid-area:p;justify-content:flex-start}
  .row .c-qty,.row .c-pmc,.row .c-px,.row .c-spark{display:none}
  .row.head{display:none}
  .row .c-per::before{content:attr(data-l);font-size:12px;color:var(--muted);font-weight:500}
  .row .c-tot::before{content:"Dal carico";font-size:12px;color:var(--muted);font-weight:500}
  .tile{min-width:104px;min-height:80px;padding:8px 10px}
  .t-var{font-size:17px}
  .d-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr}
  .bulk{grid-template-columns:1fr 110px}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
.grid2 .card{margin-bottom:0}
.cmp-row{display:grid;grid-template-columns:150px 1fr 88px;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.cmp-row b{font-weight:600}
.zbar{position:relative;height:14px;background:var(--surface2);border-radius:4px}
.zbar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.zbar span{position:absolute;top:0;bottom:0;border-radius:3px}
.cmp-val{text-align:right;font-weight:700;white-space:nowrap}
.cmp-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}
.cmp-table th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.cmp-table th:first-child,.cmp-table td:first-child{text-align:left}
.cmp-table td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:120px;margin:10px 0 4px}
.mcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.mbar{width:100%;max-width:28px;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.mbar.cond{background:repeating-linear-gradient(45deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 40%,var(--surface)) 4px 8px)}
.mbar.zero{background:var(--line)}
.mlab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:11.5px;color:var(--muted);text-align:center}
.mamt{font-size:10.5px;color:var(--muted);white-space:nowrap}
.events{list-style:none;margin:12px 0 0;padding:0;font-size:14px}
.events li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
.events .d{color:var(--muted);font-size:13px}
.events .amt{text-align:right;font-weight:600;white-space:nowrap}
.tag{font-size:11.5px;border-radius:5px;padding:1px 6px;background:var(--surface2);color:var(--muted);margin-left:6px;font-weight:500;white-space:nowrap}
.barrier{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.barrier h3{font-size:14.5px;margin:0 0 2px}
.gauge{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--loss) 35%,var(--surface)) 0 var(--bc),color-mix(in srgb,#E39B2D 35%,var(--surface)) var(--bc) var(--bk),color-mix(in srgb,var(--gain) 30%,var(--surface)) var(--bk) 100%);margin:24px 0 26px}
.gauge i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);font-style:normal}
.gauge i span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted)}
.gauge i.now{width:4px;margin-left:-1px;border-radius:2px;background:var(--accent)}
.gauge i.now span{top:auto;bottom:-19px;color:var(--ink);font-weight:600}
fieldset.fs{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
fieldset.fs legend{font-size:13px;font-weight:600;padding:0 4px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink)}
.perfgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.perfgrid label.f input{padding:6px 7px;font-size:14px}
.rt{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 12px}
.rt td,.rt th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.rt th{color:var(--muted);font-weight:500}
.rt td:first-child,.rt th:first-child{text-align:left}
.est{font-style:normal;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:5px;padding:1px 6px;margin-top:3px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
@media (max-width:760px){.cmp-row{grid-template-columns:104px 1fr 64px}.perfgrid{grid-template-columns:repeat(4,minmax(0,1fr))}fieldset.fs{grid-template-columns:1fr}.mamt{display:none}}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini:hover{border-color:var(--muted)}
.mini-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0;width:100%;overflow:hidden}
.mini-h>span{white-space:nowrap;flex-shrink:0}
.mini-h b{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini svg{width:100%;height:70px;display:block}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:16px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:6px}
.legend i.dash{border-top-style:dashed}
.banner[hidden]{display:none}
.inc-f{margin:2px 0 10px;width:max-content;max-width:100%}
.cpn-count{color:var(--accent)}
.cpn-count small{font-weight:500}
.banner.info{background:var(--surface2);color:var(--muted)}
.banner.info small{color:var(--muted)}
.pfcats{margin-top:14px;flex-wrap:wrap;width:max-content;max-width:100%}
.pfcats button{display:inline-flex;align-items:center;gap:6px}
.pfcats i{width:8px;height:8px;border-radius:50%;display:inline-block}
.cpn{padding:14px 18px 16px;border-top:1px solid var(--line);background:var(--surface)}
.cpn h3{margin:0;font-size:15px}
.tscroll{overflow-x:auto}
.cpn .cmp-table{min-width:620px}
.cpn .cmp-table td{vertical-align:top}
.cpn .cmp-table tr.tot td{border-bottom:0;border-top:2px solid var(--line)}
.cpn-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px}
</style>
</head>
<body class="range-carico">
<header class="top">
  <div class="top-in">
    <h1 class="logo"><img src="logo.png" alt="My Securities – Il mio portafoglio" width="521" height="424"></h1>
    <div class="ranges" id="ranges" role="group" aria-label="Periodo"></div>
    <div class="actions">
      <button class="btn" id="btnBulk">Aggiorna prezzi</button>
      <button class="btn primary" id="btnAdd">Aggiungi titolo</button>
      <button class="btn" id="btnTheme" aria-label="Passa al tema scuro" title="Passa al tema scuro">☾</button>
      <div class="menu" id="menu">
        <button class="btn" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-label="Altre azioni">•••</button>
        <div class="menu-pop" role="menu">
          <button id="btnExport" role="menuitem">Esporta backup</button>
          <button id="btnImport" role="menuitem">Ripristina da backup</button>
        </div>
      </div>
    </div>
  </div>
</header>

<script>

(() => {
'use strict';

/* ---------- costanti ---------- */
const CATS = [
  {id:'ETF',   label:'ETF',             color:'#6E64D2', tax:26,   quote:'unit'},
  {id:'ETC',   label:'ETC / ETN',       color:'#D9467A', tax:26,   quote:'unit'},
  {id:'AZ',    label:'Azioni',          color:'#4F86E8', tax:26,   quote:'unit'},
  {id:'TS',    label:'Titoli di Stato', color:'#1FA6D9', tax:12.5, quote:'pct'},
  {id:'OBB',   label:'Obbligazioni',    color:'#0E8C7E', tax:26,   quote:'pct'},
  {id:'CERT',  label:'Certificati',     color:'#E39B2D', tax:26,   quote:'unit'},
  {id:'FONDI', label:'Fondi',           color:'#8D6E63', tax:26,   quote:'unit'},
  {id:'ALTRO', label:'Altro',           color:'#8A94A6', tax:26,   quote:'unit'}
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const RANGES = [
  ['1G','1G','1 giorno'],['1S','1S','1 settimana'],['1M','1M','1 mese'],['3M','3M','3 mesi'],
  ['6M','6M','6 mesi'],['1A','1A','1 anno'],['3A','3A','3 anni'],['5A','5A','5 anni'],['CARICO','Dal carico','dal carico']
];
const inPfCat = h => S.pfCat === 'ALL' || (CAT[h.cat] ? h.cat : 'ALTRO') === S.pfCat;
const PERF_KEYS = ['1S','1M','3M','6M','1A','3A','5A'];
const RLABEL = Object.fromEntries(RANGES.map(r => [r[0], r[2]]));
const CAP = {'1G':3,'1S':5,'1M':8,'3M':12,'6M':18,'1A':25,'3A':40,'5A':50,'CARICO':50};
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const BENCH_COLORS = ['#2F5BD3','#8A94A6','#0E8C7E'];
// Funzione serverless (api/quote.js) per i prezzi automatici. Funziona quando l'app è servita da
// Vercel; aperta come file o come Artifact si usa solo l'inserimento manuale.
const QUOTE_API = location.protocol === 'file:' ? null : '/api/quote';
// Funzione serverless (api/portfolio.js) che salva il portafoglio in un Gist privato di GitHub.
const SYNC_API = QUOTE_API && '/api/portfolio';

/* ---------- stato ---------- */
const S = { holdings:[], hist:{}, bench:null, range:'CARICO', dRange:null, openId:null, loaded:false, pfCat:'ALL', incCat:'ALL' };
try { const r = localStorage.getItem('pf-range'); if (r) S.range = r; } catch(e){}

/* ---------- formattazione ---------- */
const NF = {};
const nf = d => NF[d] || (NF[d] = new Intl.NumberFormat('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}));
const ok = n => n != null && n !== '' && isFinite(n);
const eur = n => ok(n) ? nf(2).format(n) + ' €' : '—';
const eur0 = n => ok(n) ? nf(0).format(n) + ' €' : '—';
const eurS = n => ok(n) ? (n > 0.004 ? '+' : n < -0.004 ? '−' : '') + nf(2).format(Math.abs(n)) + ' €' : '—';
const pct = v => ok(v) ? (v > 0.00004 ? '+' : v < -0.00004 ? '−' : '') + nf(2).format(Math.abs(v*100)) + ' %' : '—';
const pp = v => ok(v) ? (v > 0.00004 ? '+' : v < -0.00004 ? '−' : '') + nf(1).format(Math.abs(v*100)) + ' pt' : '—';
const cls = v => !ok(v) || Math.abs(v) < 1e-7 ? 'flat' : v > 0 ? 'up' : 'down';
const px = n => ok(n) ? (Math.abs(n) < 10 ? nf(4).format(n) : nf(2).format(n)) : '—';
const pad = n => String(n).padStart(2,'0');
const toISO = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO = () => toISO(new Date());
const fDate = iso => { if(!iso) return ''; const [y,m,d] = iso.split('-'); return d+'/'+m+'/'+y; };
const fDateS = iso => { if(!iso) return ''; const [y,m,d] = iso.split('-'); return d+'/'+m+'/'+y.slice(2); };
function addISO(iso, {days=0, months=0, years=0}){
  const d = new Date(iso+'T12:00:00');
  d.setFullYear(d.getFullYear()+years); d.setMonth(d.getMonth()+months); d.setDate(d.getDate()+days);
  return toISO(d);
}
function addMonthsISO(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const t = (y*12 + (m-1)) + n, ny = Math.floor(t/12), nm = t % 12;
  const last = new Date(ny, nm+1, 0).getDate();
  return ny + '-' + pad(nm+1) + '-' + pad(Math.min(d, last));
}
const monthDiff = (a, b) => { const [ay,am] = a.split('-').map(Number), [by,bm] = b.split('-').map(Number); return (by-ay)*12 + (bm-am); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'h' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const NFIN = {};
const fmtIn = (n, d=4) => ok(n) ? (NFIN[d] || (NFIN[d] = new Intl.NumberFormat('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:false}))).format(n).replace(/(,\d*?)0+$/,'$1').replace(/,$/,'') : '';

function parseNum(s, intLike){
  if (s == null) return NaN;
  s = String(s).trim().replace(/["'\s€%\u00a0+]/g,'');
  if (!s || s === '-' ) return NaN;
  if (intLike && /^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'');
  const c = s.includes(','), d = s.includes('.');
  if (c && d){ if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.'); else s = s.replace(/,/g,''); }
  else if (c){ s = (s.match(/,/g).length > 1) ? s.replace(/,/g,'') : s.replace(',','.'); }
  else if (d && s.match(/\./g).length > 1){ s = s.replace(/\./g,''); }
  return Number(s);
}
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,gen:1,mag:5,giu:6,lug:7,ago:8,set:9,ott:10,dic:12};
function mkDate(y,m,d){ if (m<1||m>12||d<1||d>31||y<1970||y>2100) return null; return y+'-'+pad(m)+'-'+pad(d); }
function parseDate(s){
  s = String(s ?? '').trim().replace(/"/g,''); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return mkDate(+m[1],+m[2],+m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})\b/))){ let a=+m[1], b=+m[2], y=+m[3]; if (y<100) y+=2000; if (b>12 && a<=12) [a,b]=[b,a]; return mkDate(y,b,a); }
  if ((m = s.match(/^([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/))){ const mo = MON[m[1].toLowerCase()]; return mo ? mkDate(+m[3],mo,+m[2]) : null; }
  if ((m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?\s+(\d{4})/))){ const mo = MON[m[2].toLowerCase()]; return mo ? mkDate(+m[3],mo,+m[1]) : null; }
  return null;
}

/* ---------- CSV ---------- */
function splitLine(line, delim){
  if (delim === ' ') return line.trim().split(/\s+/);
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++){
    const ch = line[i];
    if (ch === '"'){ if (q && line[i+1] === '"'){ cur += '"'; i++; } else q = !q; }
    else if (ch === delim && !q){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(x => x.trim());
}
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 1) throw new Error('Il testo incollato è vuoto.');
  const probe = lines.slice(0, 8);
  let delim = null;
  for (const d of ['\t',';',' ',',']){
    const counts = probe.map(l => splitLine(l, d).length);
    if (counts[0] >= 2 && counts.every(c => c === counts[0])){ delim = d; break; }
  }
  if (!delim){ for (const d of ['\t',';',' ',',']){ if (splitLine(lines[lines.length-1], d).length >= 2){ delim = d; break; } } }
  if (!delim) throw new Error('Non trovo le colonne: servono almeno una colonna data e una colonna prezzo.');
  const rows = lines.map(l => splitLine(l, delim));
  let header = null;
  if (!rows[0].some(c => parseDate(c))) header = rows.shift();
  if (!rows.length) throw new Error('Nessuna riga di dati trovata.');
  const ncol = Math.max(...rows.slice(0,30).map(r => r.length));
  const sample = rows.slice(0, 40);
  let dateCol = -1, best = 0;
  for (let c = 0; c < ncol; c++){ const n = sample.filter(r => parseDate(r[c])).length; if (n > best){ best = n; dateCol = c; } }
  if (dateCol < 0) throw new Error('Non riconosco la colonna delle date (formati accettati: 31/12/2025, 2025-12-31, 31.12.2025, Dec 31, 2025).');
  let priceCol = -1;
  if (header){
    for (const re of [/^(chiusura|close|ultimo|last|prezzo|price|nav|valore|quotazione)\b/i, /chiusura|close|ultimo|prezzo|price/i]){
      priceCol = header.findIndex((h, i) => i !== dateCol && re.test(h) && !/adj|rettific|var|%|vol/i.test(h));
      if (priceCol >= 0) break;
    }
  }
  if (priceCol < 0){
    for (let c = 0; c < ncol; c++){
      if (c === dateCol) continue;
      const n = sample.filter(r => { const v = parseNum(r[c]); return ok(v) && v > 0; }).length;
      if (n >= sample.length * 0.7){ priceCol = c; break; }
    }
  }
  if (priceCol < 0) throw new Error('Non trovo una colonna di prezzi numerici.');
  const map = new Map();
  for (const r of rows){ const d = parseDate(r[dateCol]), v = parseNum(r[priceCol]); if (d && ok(v) && v > 0) map.set(d, v); }
  if (!map.size) throw new Error('Nessun prezzo valido trovato.');
  return { points:[...map.entries()].sort((a,b) => a[0] < b[0] ? -1 : 1), priceName: header ? header[priceCol] : 'colonna ' + (priceCol+1) };
}

/* ---------- archiviazione ----------
   Il portafoglio si salva solo dopo un'azione esplicita dell'utente e solo dopo
   aver letto i dati dal server: così una pagina appena aperta non può mai
   sovrascrivere i titoli con uno stato vuoto. */
const store = {
  mode:'local', db:null, uid:null, dl:null, synced:false, pending:new Set(),
  remote:null, rev:null, dirty:false, busy:false, timer:null, needKey:false, syncErr:null,
  async init(){
    try{
      if (window.claude && typeof window.claude.use === 'function'){
        const [db, user, dl] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
        this.dl = dl;
        if (db && user){ const id = await user.id(); if (id){ this.db = db; this.uid = id; this.mode = 'db'; } }
      }
    }catch(e){}
    if (this.mode !== 'db' && SYNC_API) await this.initRemote();
  },
  /* modalità remote: il portafoglio sta in un Gist tramite /api/portfolio */
  auth(){ let k = null; try{ k = localStorage.getItem('pf-key'); }catch(e){} return k ? { Authorization:'Bearer ' + k } : {}; },
  async initRemote(){
    let r;
    try{ r = await fetch(SYNC_API, { headers:this.auth(), cache:'no-store' }); }catch(e){ return; }
    if (r.status === 401){ this.mode = 'remote'; this.needKey = true; return; }
    const d = await r.json().catch(() => null);
    // 404 senza JSON: l'app non è su Vercel. 501: sincronizzazione non configurata. In entrambi i casi si resta in locale.
    if (!d || r.status === 501) return;
    if (!r.ok){ this.syncErr = 'Sincronizzazione non disponibile (' + (d.error || 'errore ' + r.status) + '): stai usando i dati salvati in questo browser, che non verranno sincronizzati.'; return; }
    this.mode = 'remote'; this.remote = d;
  },
  queue(){
    if (!this.synced) return false;
    this.saveLocal(); this.dirty = true;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 800);
    return true;
  },
  async push(){
    if (this.busy || !this.dirty) return;
    this.busy = true; this.dirty = false;
    let ok = false;
    try{
      const r = await fetch(SYNC_API, { method:'PUT', headers:{ 'Content-Type':'application/json', ...this.auth() },
        body: JSON.stringify({ holdings:S.holdings, hist:S.hist, bench:S.bench, base:this.rev }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok){ this.rev = j.updatedAt; ok = true; syncMsg(null); }
      else if (r.status === 409){
        this.busy = false;
        await this.pull(true);
        if (dlg.open) closeDlg();
        render();
        syncMsg('Il portafoglio era stato modificato da un altro browser: ho caricato la versione più recente. Se manca la tua ultima modifica, ripetila.');
        return;
      }
      else { this.dirty = true; syncMsg('Sincronizzazione non riuscita (' + (j.error || 'errore ' + r.status) + '): le modifiche sono salvate in questo browser e riprovo alla prossima modifica.'); }
    }catch(e){ this.dirty = true; syncMsg('Sincronizzazione non riuscita (connessione assente): le modifiche sono salvate in questo browser e riprovo alla prossima modifica.'); }
    finally{ this.busy = false; }
    // Modifiche arrivate durante il salvataggio: si salvano subito dopo.
    if (ok && this.dirty) this.push();
  },
  // Ricarica il portafoglio dal Gist se un altro browser l'ha cambiato. Con modifiche non ancora
  // salvate non fa nulla, a meno di force (dopo un conflitto).
  async pull(force){
    if (this.mode !== 'remote' || this.needKey || (!force && (this.dirty || this.busy))) return false;
    try{
      const r = await fetch(SYNC_API, { headers:this.auth(), cache:'no-store' });
      if (!r.ok) return false;
      const d = await r.json();
      if (!force && ((d.updatedAt || null) === this.rev || this.dirty || this.busy)) return false;
      this.rev = d.updatedAt || null; this.dirty = false;
      S.holdings = d.holdings || []; S.hist = d.hist || {}; S.bench = d.bench || null;
      this.saveLocal();
      return true;
    }catch(e){ return false; }
  },
  col(){ return this.db.collection('data/users/' + this.uid); },
  start(onData){
    if (this.mode === 'db'){
      let first = true;
      this.col().doc('portfolio').onSnapshot(async snap => {
        if (snap.metadata && snap.metadata.hasPendingWrites) return;
        const data = snap.exists ? snap.data() : null;
        const holdings = data && Array.isArray(data.holdings) ? clone(data.holdings) : [];
        await this.loadHist(holdings);
        this.synced = true; first = false;
        onData('portfolio', holdings);
      }, () => { if (first){ first = false; this.mode = 'local'; this.startLocal(onData); } });
      this.col().doc('benchmarks').onSnapshot(snap => {
        if (snap.metadata && snap.metadata.hasPendingWrites) return;
        onData('bench', snap.exists ? clone(snap.data()) : null);
      }, () => {});
      return;
    }
    if (this.mode === 'remote'){
      if (this.needKey) return onData('locked');
      let d = this.remote; this.rev = d.updatedAt || null;
      // Gist ancora vuoto: si parte dai dati già presenti in questo browser e si caricano nel Gist.
      if (!this.rev && !(d.holdings && d.holdings.length)){
        try{ const l = JSON.parse(localStorage.getItem('portafoglio-v2')); if (l && Array.isArray(l.holdings) && l.holdings.length){ d = l; this.dirty = true; } }catch(e){}
      }
      S.hist = d.hist || {};
      this.synced = true;
      onData('bench', d.bench || null);
      onData('portfolio', d.holdings || []);
      this.saveLocal();
      if (this.dirty) this.push();
      return;
    }
    this.startLocal(onData);
  },
  startLocal(onData){
    let d = null;
    try{ const raw = localStorage.getItem('portafoglio-v2'); if (raw) d = JSON.parse(raw); }catch(e){}
    S.hist = (d && d.hist) || {};
    this.synced = true;
    onData('bench', (d && d.bench) || null);
    onData('portfolio', (d && d.holdings) || []);
  },
  async loadHist(holdings){
    await Promise.all(holdings.filter(h => !this.pending.has(h.id)).map(async h => {
      try{
        const s = await this.col().doc('hist-' + h.id).get();
        const pts = s.exists ? s.data().points : null;
        S.hist[h.id] = Array.isArray(pts) ? pts.map(p => [p[0], +p[1]]).sort((a,b) => a[0] < b[0] ? -1 : 1) : [];
      }catch(e){ S.hist[h.id] = S.hist[h.id] || []; }
    }));
  },
  async savePortfolio(){
    if (!this.synced) return false;
    if (this.mode === 'remote') return this.queue();
    if (this.mode === 'db'){
      try{ await this.col().doc('portfolio').set(clone({ version:2, holdings:S.holdings, updatedAt:new Date().toISOString() })); return true; }
      catch(e){ showErr('Salvataggio non riuscito: ' + (e && (e.message || e.code) || 'errore')); return false; }
    }
    return this.saveLocal();
  },
  async saveBench(){
    if (this.mode === 'remote') return this.queue();
    if (this.mode === 'db'){
      try{ await this.col().doc('benchmarks').set(clone(S.bench || {items:[]})); return true; }
      catch(e){ showErr('Salvataggio non riuscito: ' + (e && (e.message || e.code) || 'errore')); return false; }
    }
    return this.saveLocal();
  },
  // Salva lo storico unendolo a quello sul server: un prezzo già salvato (anche da un'altra
  // finestra o da Claude) non viene mai perso; per la stessa data vince il prezzo appena inserito.
  async saveHist(id, force){
    if (this.mode === 'remote') return this.queue();
    if (this.mode === 'db'){
      this.pending.add(id);
      try{
        let pts = S.hist[id] || [];
        if (!force){
          const s = await this.col().doc('hist-' + id).get();
          const server = s.exists && Array.isArray(s.data().points) ? s.data().points : [];
          const m = new Map(server.map(p => [p[0], +p[1]]));
          for (const p of pts) m.set(p[0], p[1]);
          pts = [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
          S.hist[id] = pts;
        }
        if (pts.length) await this.col().doc('hist-' + id).set({ points: pts });
        else await this.col().doc('hist-' + id).delete();
        return true;
      }catch(e){ showErr('Salvataggio dello storico non riuscito: ' + (e && (e.message || e.code) || 'errore')); return false; }
      finally{ this.pending.delete(id); }
    }
    return this.saveLocal();
  },
  saveLocal(){
    try{ localStorage.setItem('portafoglio-v2', JSON.stringify({holdings:S.holdings, hist:S.hist, bench:S.bench})); return true; }
    catch(e){ return false; }
  }
};
function showErr(msg){ const b = document.getElementById('saveErr'); if (b){ b.textContent = msg; b.hidden = false; } }
// Messaggio sullo stato della sincronizzazione: resta visibile anche dopo un nuovo render.
function syncMsg(msg){ store.syncErr = msg; const b = document.getElementById('saveErr'); if (b){ b.textContent = msg || ''; b.hidden = !msg; } }

/* ---------- calcoli ---------- */
const isComplete = h => h.qty > 0 && h.pmc > 0 && h.price > 0;
const factor = h => h.quote === 'pct' ? h.qty / 100 : h.qty;
const perfFor = (h, r) => { const v = h.perf && h.perf.r ? h.perf.r[r] : null; return ok(v) ? v / 100 : null; };
function priceAt(H, iso){
  if (!H || !H.length) return null;
  let lo = 0, hi = H.length - 1, ans = -1;
  while (lo <= hi){ const mid = (lo + hi) >> 1; if (H[mid][0] <= iso){ ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans < 0 ? null : H[ans];
}
function tradingDay(iso){ const d = new Date(iso + 'T12:00:00'), w = d.getDay(); if (w === 6) d.setDate(d.getDate() - 1); if (w === 0) d.setDate(d.getDate() - 2); return toISO(d); }
const lastTradingDay = () => tradingDay(todayISO());
function prevPoint(H, date){ let p = null; for (const x of (H || [])){ if (x[0] < date) p = x; else break; } return p; }
const RDAYS = {'1S':7,'1M':30,'3M':91,'6M':182,'1A':365,'3A':1095,'5A':1826};
function nearestAt(H, iso, tolDays, before){
  if (!H || !H.length) return null;
  const t = Date.parse(iso + 'T00:00:00Z'); let best = null, bd = Infinity;
  for (const p of H){ if (before && p[0] >= before) continue; const d = Math.abs(Date.parse(p[0] + 'T00:00:00Z') - t) / 864e5; if (d < bd){ bd = d; best = p; } }
  return best && bd <= tolDays ? { p:best, gap:bd } : null;
}
function accruedInt(h){
  const inc = h.income;
  if (!inc || inc.kind !== 'bond' || !ok(inc.rate) || !inc.anchor || !(inc.freq > 0) || h.quote !== 'pct' || !isComplete(h)) return 0;
  const t = todayISO(), step = Math.round(12 / inc.freq);
  const prev = couponDates(inc, addMonthsISO(t, -(step + 1)), t).pop();
  if (!prev) return 0;
  const next = addMonthsISO(prev, step);
  const days = (Date.parse(t) - Date.parse(prev)) / 864e5, per = (Date.parse(next) - Date.parse(prev)) / 864e5;
  return per > 0 ? h.qty * inc.rate / 100 / inc.freq * days / per : 0;
}
function rangeStart(r){
  const t = todayISO();
  return ({ '1S':addISO(t,{days:-7}), '1M':addISO(t,{months:-1}), '3M':addISO(t,{months:-3}), '6M':addISO(t,{months:-6}),
            '1A':addISO(t,{years:-1}), '3A':addISO(t,{years:-3}), '5A':addISO(t,{years:-5}) })[r];
}
function periodBase(h, r){
  if (!isComplete(h)) return null;
  if (r === 'CARICO') return { price:h.pmc, date:h.buyDate || null, kind:'pmc' };
  const H = S.hist[h.id] || [];
  if (r === '1G'){
    const cur = h.priceDate || (H.length ? H[H.length-1][0] : null);

  const move = e => {
    const r = sv.getBoundingClientRect(); const mx = (e.clientX - r.left) * (W / r.width);

function miniSVG(pts, bpts, shadeFrom){

  let lo = Math.min(...all.map(p => p[1])), hi = Math.max(...all.map(p => p[1])); if (hi === lo){ hi += 1; lo -= 1; }
  const X = t => (t - x0) / ((x1 - x0) || 1) * W, Y = v => 4 + (hi - v) / (hi - lo) * (H - 8);
  const path = ps => ps.map((p, i) => (i ? 'L' : 'M') + X(T(p[0])).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  const col = pts[pts.length-1][1] >= pts[0][1] ? 'var(--gain)' : 'var(--loss)';
  let s = '';
  if (shadeFrom){ const sx = Math.max(0, X(T(shadeFrom))); if (sx < W) s += `<rect x="${sx.toFixed(1)}" y="0" width="${(W - sx).toFixed(1)}" height="${H}" fill="var(--accent)" opacity=".08"/>`; }
  if (bpts && bpts.length > 1) s += `<path d="${path(bpts)}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
  s += `<path d="${path(pts)}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;

/* --- cedole nel periodo --- */
function couponCounter(items){
  let net = 0, gross = 0, n = 0, missing = 0;
  for (const h of items){
    const cp = couponsIn(h, S.range);
    if (cp.state !== 'ok'){ missing++; continue; }
    net += cp.net; gross += cp.gross; n += cp.paid.length;
  }
  const lab = S.range === 'CARICO' ? 'dal primo acquisto' : RLABEL[S.range];
  return `<span class="cpn-count"><small>Cedole incassate, ${esc(lab)}</small> ${eur(net)} netti <small>(${n} ${n === 1 ? 'cedola' : 'cedole'}, lordo ${eur(gross)}${missing ? `; ${missing} ${missing === 1 ? 'titolo' : 'titoli'} senza ${S.range === 'CARICO' ? 'data di acquisto o ' : ''}dati cedola` : ''})</small></span>`;
}
function couponOnly(h){
  if (!h.income || S.range === 'CARICO') return null;
  const cp = couponsIn(h, S.range);
  if (cp.state !== 'ok' || !cp.paid.length) return null;
  const cost = calc(h, 'CARICO').cost;
  return cost ? { net:cp.net, y:cp.net / cost } : null;
}
function couponPer(h){
  const inc = h.income; if (!inc) return null;
  const nom = incNominal(h);
  if (inc.kind === 'bond') return ok(inc.rate) && ok(nom) ? nom * inc.rate / 100 / inc.freq : null;
  return ok(inc.coupon) && ok(nom) ? nom * inc.coupon / 100 : null;
}
function couponFrom(h, r){
  if (r === 'CARICO') return h.buyDate || null;
  if (r === '1G') return addISO(todayISO(), {days:-1});
  return rangeStart(r);
}
function couponsIn(h, r){
  const inc = h.income; if (!inc) return { state:'noinc' };
  const per = couponPer(h); if (!ok(per)) return { state:'noinc' };
  if (!inc.anchor) return { state:'noinc' };
  let from = couponFrom(h, r); if (!from) return { state:'nobuy' };
  if (h.buyDate && h.buyDate > from) from = h.buyDate;
  const to = todayISO();
  const dates = couponDates(inc, addISO(from, {days:1}), to);
  const missed = new Set(inc.missed || []);
  const share = d => h.qty > 0 ? qtyAt(h, addISO(d, {days:-1})) / h.qty : 1;
  const held = dates.filter(d => share(d) > 1e-9);
  const paid = held.filter(d => !missed.has(d));
  const gross = paid.reduce((a, d) => a + per * share(d), 0);
  const tax = taxRate(h) / 100;
  return { state:'ok', from, dates: held, paid, per, gross, net: gross * (1 - tax), annual: per * inc.freq, skipped: held.length - paid.length };
}
function couponsBlock(items){
  const r = S.range, rl = RLABEL[r];

    const cp = couponsIn(h, r), c = calc(h, r), cost = calc(h, 'CARICO').cost;
    if (cp.state === 'noinc') return `<tr><td>${esc(h.name)}</td><td colspan="6" style="text-align:left"><button class="btn small" data-open="${h.id}" data-edit="1">Imposta cedola, frequenza e data di pagamento</button></td></tr>`;
    if (cp.state === 'nobuy') return `<tr><td>${esc(h.name)}</td><td colspan="6" style="text-align:left"><small>Per il calcolo “dal carico” serve la data del primo acquisto.</small> <button class="btn small" data-open="${h.id}" data-edit="1">Inserisci la data</button></td></tr>`;
    const cy = cost ? cp.net / cost : null;
    const base = r === 'CARICO' ? cost : (ok(c.plPer) ? c.value - c.plPer : null);
    const priceCh = r === 'CARICO' ? c.plTot : c.plPer;
    const tot = ok(priceCh) ? priceCh + cp.net : null;
    const totPct = ok(tot) && base ? tot / base : null;
    return { h, cp, cy, priceCh, tot, totPct, html: `<tr><td><button style="all:unset;cursor:pointer" data-open="${h.id}" data-panel="coupons">${esc(h.name)}</button><br><small>cedola annua ${cost ? nf(2).format(cp.annual / cost * 100) + ' % lordo sul carico' : '—'}</small></td>
      <td>${cp.paid.length}${cp.skipped ? `<br><small>${cp.skipped} non pagata${cp.skipped > 1 ? 'e' : ''}</small>` : ''}</td>
      <td>${eur(cp.net)}<br><small>lordo ${eur(cp.gross)}</small></td>
      <td class="${cls(cy)}">${pct(cy)}</td>
      <td class="${cls(priceCh)}">${eurS(priceCh)}</td>
      <td class="${cls(tot)}"><b>${eurS(tot)}</b><br><small>${pct(totPct)}</small></td></tr>` };
  });
  const okRows = rows.filter(x => typeof x === 'object');
  const sumNet = okRows.reduce((a, x) => a + x.cp.net, 0);
  const sumCost = okRows.reduce((a, x) => a + (calc(x.h, 'CARICO').cost || 0), 0);
  const allTot = okRows.every(x => ok(x.tot));
  const sumTot = allTot ? okRows.reduce((a, x) => a + x.tot, 0) : null;
  return `<div class="cpn"><div class="card-h" style="margin-bottom:4px"><h3>Cedole incassate, ${esc(rl)}</h3><small>${r === 'CARICO' ? 'dalla data del primo acquisto' : 'dal ' + fDate(couponFrom(items[0], r))} a oggi</small></div>
    <div class="tscroll"><table class="cmp-table"><tr><th>Titolo</th><th>Cedole</th><th>Incassato netto</th><th>Rendimento cedolare</th><th>Variazione prezzo</th><th>Rendimento totale</th></tr>
    ${rows.map(x => typeof x === 'object' ? x.html : x).join('')}
    ${okRows.length > 1 ? `<tr class="tot"><td><b>Totale</b></td><td></td><td><b>${eur(sumNet)}</b></td><td class="${cls(sumNet)}">${pct(sumCost ? sumNet / sumCost : null)}</td><td></td><td class="${cls(sumTot)}"><b>${eurS(sumTot)}</b></td></tr>` : ''}
    </table></div>
    <p class="note" style="margin:8px 0 0">Il rendimento cedolare è il netto incassato diviso per il capitale investito; il rendimento totale somma cedole nette e variazione di prezzo. Le cedole condizionate si considerano pagate: se una non è stata pagata, segnalala nella scheda del titolo (tocca il nome). Le date di pagamento dei certificati sono indicative e possono differire di qualche giorno.</p></div>`;
}

function footer(){
  const src = [];
  if (S.bench && S.bench.asOf) src.push(`Indici di riferimento al ${fDate(S.bench.asOf)} (${esc(S.bench.source || 'fonte esterna')}).`);
  return `<p class="foot">${store.mode === 'db' ? 'I dati sono salvati nel tuo account, visibili solo a te.' : store.mode === 'remote' ? 'I dati sono salvati nel Gist privato su GitHub e sono gli stessi su tutti i browser.' : 'I dati sono salvati solo in questo browser: esporta un backup ogni tanto.'}
   ${src.join(' ')} Il netto stimato applica il 26 % (12,5 % ai titoli di Stato) alle sole plusvalenze, senza compensare le minusvalenze: è un ordine di grandezza, non un calcolo fiscale. Su 1 giorno l'asterisco indica che l'ultimo prezzo non è di oggi. Negli altri periodi indica che la variazione è calcolata dal prezzo disponibile più vicino all'inizio del periodo (la data esatta è nella scheda del titolo). Il valore dei BTP include il rateo di interessi maturato, come nell'app della banca.</p>`;
}
function rowHTML(h, c){

/* --- confronto con gli indici --- */
function benchVal(b, r){ const v = b && b.r ? b.r[r] : null; return ok(v) ? v / 100 : null; }
function zbar(v, max, color){
  if (!ok(v)) return '<div class="zbar"></div>';
  const w = Math.min(50, Math.abs(v) / max * 50);
  return `<div class="zbar"><span style="${v >= 0 ? 'left:50%' : 'right:50%'};width:${w.toFixed(1)}%;background:${color}"></span></div>`;
}
function benchCard(T){
  const bs = (S.bench && S.bench.items) || [];
  const head = `<div class="card-h"><h2>Confronto con il mercato</h2><button class="btn small" data-act="editBench">Aggiorna indici</button></div>`;
  if (!bs.length) return `<section class="card">${head}<div class="chart-empty">Nessun indice di riferimento. Aggiungi i rendimenti di MSCI World e S&amp;P 500 con “Aggiorna indici”.</div></section>`;
  if (S.range === 'CARICO' || S.range === '1G'){
    return `<section class="card">${head}<p class="note" style="margin-top:4px">Scegli un periodo da 1 settimana a 5 anni in alto per confrontare il portafoglio con ${bs.map(b => esc(b.name)).join(' e ')}.</p>
      <table class="rt"><tr><th>Indice</th>${PERF_KEYS.map(k => `<th>${k}</th>`).join('')}</tr>
      ${bs.map(b => `<tr><td>${esc(b.name)}</td>${PERF_KEYS.map(k => `<td class="${cls(benchVal(b,k))}">${ok(benchVal(b,k)) ? nf(1).format(b.r[k]) : '—'}</td>`).join('')}</tr>`).join('')}</table></section>`;
  }
  const rows = [{ name:'Il tuo portafoglio', v:T.varPer, color:'var(--ink)', me:true }].concat(bs.map((b, i) => ({ name:b.name, v:benchVal(b, S.range), color:BENCH_COLORS[i % 3] })));
  const max = Math.max(0.01, ...rows.map(r => ok(r.v) ? Math.abs(r.v) : 0));
  let verdict = '';
  if (ok(T.varPer)){
    const diffs = bs.map(b => ({ b, d: ok(benchVal(b, S.range)) ? T.varPer - benchVal(b, S.range) : null })).filter(x => ok(x.d));
    if (diffs.length) verdict = `<p class="note" style="margin:6px 0 0">${diffs.map(x => `${x.d >= 0 ? 'Batti' : 'Resti indietro rispetto a'} ${esc(x.b.name)} di <b class="${cls(x.d)}">${nf(1).format(Math.abs(x.d*100))} punti</b>`).join('; ')}${T.cov < T.n ? `, considerando ${T.cov} titoli su ${T.n} (${nf(0).format(T.covVal / T.value * 100)} % del valore).` : '.'}</p>`;
  }
  const hs = S.holdings.map(h => ({ h, v: calc(h, S.range).varPer })).filter(x => ok(x.v)).sort((a, b) => b.v - a.v);
  return `<section class="card">${head}
    ${rows.map(r => `<div class="cmp-row"><span>${r.me ? '<b>' + esc(r.name) + '</b>' : esc(r.name)}</span>${zbar(r.v, max, r.color)}<span class="cmp-val ${cls(r.v)}">${pct(r.v)}</span></div>`).join('')}
    ${verdict}
    ${hs.length ? `<table class="cmp-table"><tr><th>Titolo, ${esc(RLABEL[S.range])}</th><th>Rendimento</th>${bs.map(b => `<th>vs ${esc(b.name)}</th>`).join('')}</tr>
      ${hs.map(x => `<tr><td>${esc(x.h.name)}</td><td class="${cls(x.v)}">${pct(x.v)}</td>${bs.map(b => { const bv = benchVal(b, S.range); const d = ok(bv) ? x.v - bv : null; return `<td class="${cls(d)}">${pp(d)}</td>`; }).join('')}</tr>`).join('')}</table>` : ''}
  </section>`;
}

/* --- cedole e barriere --- */
function incomeCard(){
  const from = todayISO(), to = addISO(addMonthsISO(from.slice(0,8) + '01', 12), {days:-1});
  const inF = h => S.incCat === 'ALL' || (S.incCat === 'TS' ? (h.cat === 'TS' || h.cat === 'OBB') : h.cat === S.incCat);
  const ev = incomeEvents(from, to).filter(e => inF(e.h));
  const fb = (id, label) => `<button data-inccat="${id}" aria-pressed="${S.incCat === id}">${label}</button>`;
  const filt = S.holdings.some(h => h.income && h.cat === 'CERT') && S.holdings.some(h => h.income && (h.cat === 'TS' || h.cat === 'OBB'))
    ? `<div class="ranges inc-f" role="group" aria-label="Filtra cedole">${fb('ALL','Tutti')}${fb('TS','Titoli di Stato')}${fb('CERT','Certificati')}</div>` : '';
  const head = `<div class="card-h"><h2>Cedole e scadenze</h2><small>prossimi 12 mesi</small></div>${filt}`;
  const hasIncome = S.holdings.some(h => h.income && inF(h));
  const candidates = S.holdings.filter(h => ['TS','OBB','CERT'].includes(h.cat) && !h.income && inF(h));
  if (!hasIncome){
    return `<section class="card">${head}<div class="chart-empty">Imposta cedola, scadenza e barriere dei tuoi BTP e certificati per vedere gli incassi mese per mese.${candidates.length ? `<br><button class="btn small" style="margin-top:10px" data-open="${candidates[0].id}" data-edit="1">Imposta ${esc(candidates[0].name)}</button>` : ''}</div></section>`;
  }
  const months = [];
  const m0 = from.slice(0,7);
  for (let i = 0; i < 12; i++){ const k = addMonthsISO(m0 + '-01', i).slice(0,7); months.push({ k, gross:0, net:0, cond:false }); }
  let tg = 0, tn = 0, condN = 0;
  for (const e of ev){
    if (e.type === 'maturity' || !ok(e.gross)) continue;
    const m = months.find(x => x.k === e.date.slice(0,7)); if (!m) continue;
    m.gross += e.gross; m.net += e.net; if (e.type === 'cond'){ m.cond = true; condN += e.gross; }
    tg += e.gross; tn += e.net;
  }
  const max = Math.max(1, ...months.map(m => m.net));
  const bars = months.map(m => `<div class="mcol" title="${esc(MESI[+m.k.slice(5)-1] + ' ' + m.k.slice(0,4))}: ${eur(m.net)} netti">
      ${m.net > 0 ? `<span class="mamt">${nf(0).format(m.net)}</span>` : ''}
      <div class="mbar ${m.net > 0 ? (m.cond ? 'cond' : '') : 'zero'}" style="height:${m.net > 0 ? Math.max(4, m.net / max * 92) : 2}px"></div></div>`).join('');
  const labels = months.map(m => `<span>${MESI[+m.k.slice(5)-1]}</span>`).join('');
  const list = ev.slice(0, 10).map(e => `<li><span class="d">${fDateS(e.date)}</span>
      <span><button class="linkish" data-open="${e.h.id}" style="all:unset;cursor:pointer">${esc(e.h.name)}</button>${e.type === 'maturity' ? '<span class="tag">scadenza e rimborso</span>' : e.type === 'cond' ? '<span class="tag">cedola condizionata</span>' : ''}</span>
      <span class="amt">${e.type === 'maturity' ? eur0(e.gross) : ok(e.net) ? eur(e.net) + ' <small>netti</small>' : '<small>imposta la cedola</small>'}</span></li>`).join('');
  const certs = S.holdings.filter(h => inF(h) && h.income && h.income.kind === 'cert' && (ok(h.income.barrierCapital) || ok(h.income.barrierCoupon)));
  const barriers = certs.map(h => barrierHTML(h)).join('');
  const missing = candidates.length ? `<p class="note" style="margin:10px 0 0">${candidates.length === 1 ? '1 titolo' : candidates.length + ' titoli'} senza dati cedola: <button class="btn small" data-open="${candidates[0].id}" data-edit="1">Imposta ${esc(candidates[0].name)}</button></p>` : '';
  return `<section class="card">${head}
    <div class="cmp-row" style="grid-template-columns:1fr auto"><span>Incasso atteso, netto</span><span class="cmp-val">${eur(tn)}</span></div>
    <div class="cmp-row" style="grid-template-columns:1fr auto;padding-top:0"><small>lordo ${eur(tg)}${condN ? `, di cui ${eur(condN)} lordi condizionati (righe tratteggiate)` : ''}</small><span></span></div>
    <div class="months">${bars}</div><div class="mlab">${labels}</div>
    ${list ? `<ul class="events">${list}</ul>` : ''}
    ${barriers}${missing}
  </section>`;
}
function barrierHTML(h){
  const inc = h.income, w = inc.worst, bk = inc.barrierCoupon, bc = inc.barrierCapital;
  const scale = Math.max(130, ok(w) ? w + 10 : 0);
  const pos = v => (Math.max(0, Math.min(scale, v)) / scale * 100).toFixed(1) + '%';
  let status = 'Inserisci il livello attuale del sottostante peggiore', sc = 'flat';
  if (ok(w)){
    if (ok(bc) && w < bc){ status = `Sotto la barriera del capitale di ${nf(1).format(bc - w)} punti`; sc = 'down'; }
    else if (ok(bk) && w < bk && !inc.fixed){ status = `Sotto la barriera cedola di ${nf(1).format(bk - w)} punti: cedola a rischio`; sc = 'down'; }
    else { const ref = ok(bk) ? bk : bc; status = `${nf(1).format(w - ref)} punti sopra la barriera ${ok(bk) ? 'cedola' : 'del capitale'} (margine ${nf(1).format((w / ref - 1) * 100)} %)`; sc = w - ref < 10 ? 'flat' : 'up'; }
  }
  return `<div class="barrier"><h3>${esc(h.name)}</h3><small>${esc(inc.underlyings || 'sottostanti non indicati')}${inc.updated ? `, livello aggiornato al ${fDateS(inc.updated)}` : ''}</small>
    <div class="gauge" style="--bc:${ok(bc) ? pos(bc) : '0%'};--bk:${ok(bk) ? pos(bk) : (ok(bc) ? pos(bc) : '0%')}">
      ${ok(bc) ? `<i style="left:${pos(bc)}"><span>capitale ${nf(0).format(bc)}%</span></i>` : ''}
      ${ok(bk) && bk !== bc ? `<i style="left:${pos(bk)}"><span>cedola ${nf(0).format(bk)}%</span></i>` : ''}
      <i style="left:${pos(100)};opacity:.35"><span>100%</span></i>
      ${ok(w) ? `<i class="now" style="left:${pos(w)}"><span>ora ${nf(1).format(w)}%</span></i>` : ''}
    </div><p class="note ${sc}" style="margin:0">${status}</p></div>`;
}

/* ---------- dialoghi ---------- */
const dlg = $('#dlg');
function openDlg(html){ dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function closeDlg(){ if (dlg.open) dlg.close(); S.openId = null; }
dlg.addEventListener('close', () => { S.openId = null; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });

function perfTable(h){
  const bs = (S.bench && S.bench.items) || [];
  const rows = [{ name:h.name, r:h.perf ? h.perf.r : {} , me:true }].concat(bs.map(b => ({ name:b.name, r:b.r })));
  return `<table class="rt"><tr><th></th>${PERF_KEYS.map(k => `<th>${k}</th>`).join('')}</tr>
    ${rows.map(x => `<tr><td>${x.me ? '<b>' + esc(x.name) + '</b>' : esc(x.name)}</td>${PERF_KEYS.map(k => { const v = x.r && ok(x.r[k]) ? x.r[k] : null; return `<td class="${cls(v)}">${ok(v) ? nf(1).format(v) : '—'}</td>`; }).join('')}</tr>`).join('')}
  </table>`;
}
function detail(id, panel){
  const h = S.holdings.find(x => x.id === id); if (!h) return closeDlg();
  S.openId = id;
  if (!S.dRange) S.dRange = S.range;
  const r = S.dRange, c = calc(h, r), cat = CAT[h.cat] || CAT.ALTRO, done = isComplete(h);
  const H = S.hist[h.id] || [];
  const perfNote = h.perf ? `Rendimenti in % (in EUR) al ${fDate(h.perf.asOf)}${h.perf.source ? ', fonte ' + esc(h.perf.source) : ''}.` : '';
  openDlg(`
    <div class="dlg-h"><span class="cat-dot" style="--cat:${cat.color};margin-top:8px"></span>
      <div><h2>${esc(h.name)}</h2><small>${esc([h.isin, cat.label].filter(Boolean).join(', '))}</small></div>
      <button class="x" data-act="close" aria-label="Chiudi">×</button></div>
    <div class="dlg-b">
      <div class="d-stats">
        <div><div class="k">Valore</div><div class="v">${eur(c.value)}</div>${done ? `<div class="s flat">${nf(Number.isInteger(h.qty)?0:2).format(h.qty)} × ${px(h.price)}${h.quote === 'pct' ? ' %' : ''}${c.acc ? `, rateo ${eur(c.acc)}` : ''}</div>` : ''}</div>
        <div><div class="k">Carico</div><div class="v">${eur(c.cost)}</div>${done ? `<div class="s flat">PMC ${px(h.pmc)}</div>` : ''}</div>
        <div><div class="k">Dal carico</div><div class="v ${cls(c.plTot)}">${eurS(c.plTot)}</div><div class="s ${cls(c.varTot)}">${pct(c.varTot)}${c.realized ? ` <span class="partial">realizzato ${eurS(c.realized)}</span>` : ''}</div></div>
        <div><div class="k">${r === 'CARICO' ? 'Netto stimato' : esc(RLABEL[r])}</div>${r === 'CARICO'
          ? `<div class="v ${cls(c.plTot)}">${eurS(ok(c.plTot) ? (c.plTot > 0 ? c.plTot * (1 - taxRate(h)/100) : c.plTot) : null)}</div><div class="s flat">aliquota ${nf(1).format(taxRate(h))} %</div>`
          : `<div class="v ${cls(c.plPer)}">${eurS(c.plPer)}</div><div class="s ${cls(c.varPer)}">${pct(c.varPer)}${c.base && c.base.date ? ` <span class="partial">dal ${fDateS(c.base.date)}</span>` : ''}</div>`}</div>
      </div>
      ${h.est ? `<div class="bankbox" style="margin-bottom:12px">La quantità (${nf(0).format(h.qty)}) è stimata dal valore indicato dalla banca. Verificala nella scheda del titolo e correggila con “Modifica”.</div>` : ''}
      <div class="ranges" id="dRanges">${RANGES.map(x => `<button data-drange="${x[0]}" aria-pressed="${r === x[0]}">${x[1]}</button>`).join('')}</div>
      ${done && (H.length >= 10 || (!h.perf && H.length >= 3)) ? `<div class="chart" id="dChart"></div>
        <p class="note">Linea tratteggiata: il tuo prezzo medio di carico. Storico dal ${fDate(H[0][0])} al ${fDate(H[H.length-1][0])}, ${nf(0).format(H.length)} prezzi.</p>` : ''}
      ${(!done || H.length < 10) && h.perf ? `<div class="chart" id="dPerf"></div><p class="note">Andamento nel periodo scelto, ricostruito dai rendimenti per periodo (100 = inizio periodo; con “Dal carico” mostra 5 anni): indica la tendenza, non le oscillazioni giornaliere. Per il grafico giornaliero importa lo storico prezzi.</p>` : ''}
      ${h.perf || (S.bench && S.bench.items && S.bench.items.length) ? `${perfTable(h)}<p class="note" style="margin-top:-6px">${perfNote}</p>` : ''}
      ${!done ? `<div class="bankbox" style="margin-bottom:14px">Titolo importato dalla schermata della banca senza quantità. Inserisci la quantità posseduta: prezzo attuale e di carico li ricavo dai valori della banca.</div>` : (H.length < 3 && !h.perf ? `<p class="note">Ancora nessuno storico prezzi: importalo da un CSV oppure aggiorna il prezzo ogni giorno, e qui comparirà il grafico.</p>` : '')}
      <div class="actions">
        <button class="btn ${done ? '' : 'primary'}" data-act="edit">${done ? 'Modifica' : 'Inserisci la quantità'}</button>
        ${done ? `<button class="btn primary" data-act="panel" data-p="buy">Aggiungi quote</button><button class="btn" data-act="panel" data-p="sell">Vendi quote</button><button class="btn" data-act="panel" data-p="price">Aggiorna prezzo</button><button class="btn" data-act="panel" data-p="import">Importa storico</button>` : ''}
        <button class="btn" data-act="panel" data-p="perf">Rendimenti per periodo</button>
        ${h.income && h.income.anchor ? '<button class="btn" data-act="panel" data-p="coupons">Cedole incassate</button>' : ''}
        ${h.isin && /^[A-Z]{2}[A-Z0-9]{9}\d$/.test(h.isin) && (h.cat === 'ETF' || h.cat === 'ETC') ? `<a class="btn" href="https://www.justetf.com/it/etf-profile.html?isin=${encodeURIComponent(h.isin)}" target="_blank" rel="noopener">Scheda su justETF</a>` : ''}
        <button class="btn danger" data-act="delete">Elimina titolo</button>
      </div>
      <div id="dPanel"></div>
      ${done && h.tx && h.tx.length > 1 ? txListHTML(h) : ''}
    </div>`);
  if (done && (H.length >= 10 || (!h.perf && H.length >= 3))){
    const pts = seriesFor(h, r);
    mountChart($('#dChart'), pts, {
      h:250, aria:'Andamento del prezzo di ' + h.name, refs:[{ v:h.pmc, label:'Carico ' + px(h.pmc) }],
      empty:'Lo storico non copre questo periodo.', trendBase: pts.length ? pts[0][1] : undefined,
      tip:(i, p) => `${fDate(p[i][0])}<br><b>${px(p[i][1])}</b><br>dal carico ${pct(p[i][1] / h.pmc - 1)}<br>da inizio periodo ${pct(p[i][1] / p[0][1] - 1)}`
    });
  }
  const dp = $('#dPerf');
  if (dp){
    const from = (r !== 'CARICO' && r !== '1G') ? rangeStart(r) : null;
    const raw = perfSeries(h.perf), w = from ? raw.filter(p => p[0] >= addISO(from, {days:-10})) : raw;
    const pts = normalize(w.length >= 2 ? w : raw);
    const bs = (S.bench && S.bench.items) || [];
    const series = [{ name:h.name, color:cat.color, pts, dots:true, w:2.6 }].concat(bs.map((b, i) => ({ name:b.name, color:BENCH_COLORS[(i + 1) % 3], dash:true, pts:normalize(benchIndex(b, 100).filter(p => pts[0] && p[0] >= addISO(pts[0][0], {days:-10}))) })));
    mountMulti(dp, series, { h:250, fmt:v => nf(0).format(v), aria:'Andamento di ' + h.name, refs:[{ v:100, label:'inizio periodo' }] });
  }
  if (panel) showPanel(panel);
}
function txListHTML(h){
  const rows = h.tx.slice().reverse().map(t => `<tr><td>${t.date ? fDate(t.date) : 'prima del ' + (h.tx.find(x => x.date) ? fDate(h.tx.find(x => x.date).date) : 'primo movimento')}</td>
    <td>${t.kind === 'iniziale' ? 'Posizione iniziale' : t.qty > 0 ? 'Acquisto' : 'Vendita'}</td>
    <td class="${t.qty > 0 ? 'up' : 'down'}">${t.qty > 0 ? '+' : '−'}${nf(Number.isInteger(t.qty) ? 0 : 2).format(Math.abs(t.qty))}</td>
    <td>${px(t.price)}</td><td>${eur(fq(h, Math.abs(t.qty)) * t.price)}</td>

function readIncome(){
  const fs = $('#incFs'); if (!fs || fs.hidden) return undefined;
  const kind = $('#iKind').value; if (kind === 'none') return null;
  const n = (id, intLike) => { const v = parseNum($(id).value, intLike); return ok(v) ? v : null; };
  const inc = { kind, freq: +$('#iFreq').value, anchor: $('#iAnchor').value || null, maturity: $('#iMat').value || null };
  if (kind === 'bond') inc.rate = n('#iRate');
  else Object.assign(inc, { coupon:n('#iCoupon'), nominal:n('#iNom', true), underlyings:$('#iUnd').value.trim(), barrierCoupon:n('#iBk'), barrierCapital:n('#iBc'), worst:n('#iWorst'), memory:$('#iMem').checked, fixed:$('#iFixed').checked });
  if (kind === 'cert' && ok(inc.worst)) inc.updated = todayISO();
  const cur = S.holdings.find(x => x.id === ($('#eForm') && $('#eForm').dataset.id));
  if (cur && cur.income){
    if (cur.income.missed) inc.missed = cur.income.missed;
    if (cur.income.start) inc.start = cur.income.start;
    if (kind === 'cert' && !ok(inc.worst) && ok(cur.income.worst)) inc.worst = cur.income.worst;
  }
  return inc;
}
function saveEdit(){
  const id = $('#eForm').dataset.id;
  const h = id ? S.holdings.find(x => x.id === id) : null;
  const err = m => { $('#eErr').textContent = m; };
  const name = $('#eName').value.trim(); if (!name) return err('Inserisci il nome del titolo.');
  const quote = $('#eQuote').value, cat = $('#eCat').value;
  const qty = parseNum($('#eQty').value, true);
  const income = readIncome();
  const common = { name, isin: $('#eIsin').value.trim().toUpperCase(), cat, quote, buyDate: $('#eBuy').value || null, tax: parseFloat($('#eTax').value) };
  if (income !== undefined) common.income = income; 
  if (!(qty > 0)){
    if (h && h.bank && !isComplete(h)){
      Object.assign(h, common); if (income === null) delete h.income;
      store.savePortfolio(); S.dRange = null; render(); return detail(h.id);
    }
    return err('Inserisci una quantità maggiore di zero.');
  }
  const f = quote === 'pct' ? qty / 100 : qty;
  let pmc = parseNum($('#ePmc').value), price = parseNum($('#ePrice').value);
  if (!(pmc > 0) && h && h.bank) pmc = h.bank.cost / f;
  if (!(price > 0) && h && h.bank) price = h.bank.value / f;
  if (!(pmc > 0)) return err('Inserisci il prezzo medio di carico.');
  if (!(price > 0)) return err('Inserisci il prezzo attuale.');
  const priceDate = $('#ePDate').value || todayISO();
  const rec = Object.assign({ id: h ? h.id : uid(), qty, pmc: round(pmc), price: round(price), priceDate }, common);
  if (h){
    // Il ticker trovato da /api/quote resta valido finché l'ISIN non cambia.
    const keep = { perf:h.perf, bank:h.bank, income:h.income, tx:h.tx, realized:h.realized, feed: h.isin === common.isin ? h.feed : null };
    Object.keys(h).forEach(k => delete h[k]);
    Object.assign(h, rec);
    if (keep.perf) h.perf = keep.perf;
    if (keep.bank) h.bank = keep.bank;
    if (keep.feed) h.feed = keep.feed;
    if (keep.tx){ h.tx = keep.tx; h.realized = keep.realized; const ini = h.tx.find(t => t.kind === 'iniziale'); if (ini && !h.tx.some(t => t.date && t.kind !== 'iniziale')) ini.date = h.buyDate || null; recomputeTx(h); }
    if (income === undefined && keep.income) h.income = keep.income;
    if (income === null) delete h.income;
  } else { if (income === null) delete rec.income; S.holdings.push(rec); }
  addPoint(rec.id, priceDate, rec.price);
  store.savePortfolio(); store.saveHist(rec.id);
  S.dRange = null;
  render(); detail(rec.id);
}
const round = n => Math.round(n * 1e6) / 1e6;
function addPoint(id, date, price){
  const H = S.hist[id] = S.hist[id] || [];
  const i = H.findIndex(p => p[0] === date);
  if (i >= 0) H[i] = [date, price]; else { H.push([date, price]); H.sort((a, b) => a[0] < b[0] ? -1 : 1); }
}
function savePrice(){
  const h = S.holdings.find(x => x.id === S.openId); if (!h) return;
  const raw = $('#pDate').value || todayISO(), p = parseNum($('#pPrice').value);
  if (raw > todayISO()){ $('#pErr').textContent = 'La data non può essere nel futuro.'; return; }
  if (!(p > 0)){ $('#pErr').textContent = 'Inserisci un prezzo valido.'; return; }
  const d = tradingDay(raw);
  addPoint(h.id, d, p);
  if (!h.priceDate || d >= h.priceDate){ h.price = p; h.priceDate = d; }
  store.savePortfolio(); store.saveHist(h.id);
  render(); detail(h.id);
}
function saveTx(sell){
  const h = S.holdings.find(x => x.id === S.openId); if (!h) return;
  const err = m => { $('#tErr').textContent = m; };
  const d = $('#tDate').value || todayISO();
  if (d > todayISO()) return err('La data non può essere nel futuro.');
  const q = parseNum($('#tQty').value, true), pr = parseNum($('#tPrice').value);
  if (!(q > 0)) return err('Inserisci il numero di quote.');
  if (!(pr > 0)) return err('Inserisci il prezzo.');
  const snapshot = { tx: h.tx ? clone(h.tx) : null, qty:h.qty, pmc:h.pmc, buyDate:h.buyDate, realized:h.realized, nom: h.income && h.income.nominal };
  ensureTx(h);
  if (sell && q > qtyAt(h, d) + 1e-9) { if (!snapshot.tx) delete h.tx; return err(`Al ${fDate(d)} possiedi ${nf(2).format(qtyAt(h, d))} quote: non puoi venderne di più.`); }
  h.tx.push({ id: uid(), date: d, qty: sell ? -q : q, price: pr, kind: sell ? 'vendita' : 'acquisto' });
  const e = recomputeTx(h);
  if (e){
    if (snapshot.tx) h.tx = snapshot.tx; else delete h.tx;
    Object.assign(h, { qty:snapshot.qty, pmc:snapshot.pmc, buyDate:snapshot.buyDate, realized:snapshot.realized });
    if (h.income && snapshot.nom) h.income.nominal = snapshot.nom;
    return err(e);
  }
  store.savePortfolio(); render(); detail(h.id);
}
function savePerf(){
  const h = S.holdings.find(x => x.id === S.openId); if (!h) return;
  const r = readPerf('pf'); if (!r){ $('#pfErr').textContent = 'Inserisci almeno un rendimento.'; return; }
  h.perf = { asOf: $('#pfDate').value || todayISO(), source: $('#pfSrc').value.trim() || null, r };
  store.savePortfolio(); render(); detail(h.id);
}
function doImport(){
  const h = S.holdings.find(x => x.id === S.openId); if (!h) return;
  let res;
  try{ res = parseCSV($('#csv').value); }catch(e){ $('#iErr').textContent = e.message; return; }
  const last = res.points[res.points.length - 1];
  const ratio = last[1] / h.price;
  for (const [d, v] of res.points) addPoint(h.id, d, v);
  if (!h.priceDate || last[0] >= h.priceDate){ h.price = last[1]; h.priceDate = last[0]; }
  store.savePortfolio(); store.saveHist(h.id);
  render(); detail(h.id);
  const msg = document.createElement('p');
  const off = ratio > 1.5 || ratio < 0.67;
  msg.className = off ? 'err' : 'ok';
  msg.textContent = `Importati ${nf(0).format(res.points.length)} prezzi (${res.priceName}), dal ${fDate(res.points[0][0])} al ${fDate(last[0])}.` + (off ? ' Attenzione: l’ultimo prezzo è molto diverso da quello che avevi. Controlla che sia lo strumento giusto e la stessa valuta.' : '');
  $('#dPanel').prepend(msg);
}

async function fetchQuote(h){
  const H = S.hist[h.id] || [], f = h.feed;
  const p = new URLSearchParams({ q: (h.isin || f.symbol).trim().toUpperCase() });
  if (f && f.symbol) p.set('symbol', f.symbol);
  // La prima volta scarica 5 anni di storico, poi solo gli ultimi giorni.
  if (f && f.symbol && H.length) p.set('from', addISO(H[H.length - 1][0], { days: -7 }));
  else p.set('range', '5y');
  const r = await fetch(QUOTE_API + '?' + p, { signal: AbortSignal.timeout(20000) });
  const j = await r.json().catch(() => null);
  if (!j) throw new Error('servizio non disponibile');
  if (r.status === 404 || r.status === 400) return null;
  if (!r.ok || !(j.price > 0)) throw new Error(j.error || 'errore ' + r.status);
  return j;
}
// Un titolo trovato per la prima volta va confrontato con i prezzi che hai già: se non tornano
// (altra valuta, strumento sbagliato, BTP quotato diversamente) il prezzo resta da confermare.
function checkQuote(h, q){
  if (q.currency && q.currency !== 'EUR') return `Trovato ${q.symbol} in ${q.currency}: controlla e inserisci il prezzo in euro.`;
  if (h.feed && h.feed.symbol === q.symbol) return null;
  const ref = h.priceDate && nearestAt(q.history, h.priceDate, 5);
  const v = ref ? ref.p[1] / h.price - 1 : q.price / h.price - 1, tol = ref ? 0.08 : 0.25;
  return Math.abs(v) > tol ? `Trovato ${q.symbol} a ${px(ref ? ref.p[1] : q.price)}, ${pct(v)} rispetto al tuo prezzo del ${fDateS(h.priceDate)}: controlla che sia lo strumento giusto.` : null;
}
async function autoUpdate(){
  await refreshHist();
  const hs = S.holdings.filter(isComplete);
  auto = null;
  if (!hs.length || !QUOTE_API) return bulkForm();
  const todo = hs.filter(h => (h.isin && h.isin.trim()) || (h.feed && h.feed.symbol));
  auto = { done:[], left:new Set(hs.map(h => h.id)), sug:{}, why:{}, off:null };
  for (const h of hs) if (!todo.includes(h)) auto.why[h.id] = 'Senza ISIN: inserisci il prezzo a mano.';
  openDlg(`<div class="dlg-h"><h2>Aggiorna prezzi</h2><button class="x" data-act="close" aria-label="Chiudi">×</button></div>
    <div class="dlg-b"><p class="note" style="margin-top:0" id="autoProg">Cerco i prezzi di ${todo.length === 1 ? '1 titolo' : todo.length + ' titoli'}…</p></div>`);
  const run = auto;
  let n = 0, fail = 0, got = 0;
  const step = async h => {
    let q = null;
    try{ q = await fetchQuote(h); got++; }
    catch(e){ fail++; }
    const pr = $('#autoProg'); if (pr) pr.textContent = `Cerco i prezzi… ${++n} di ${todo.length}`;
    if (!q){ if (!run.why[h.id]) run.why[h.id] = 'Prezzo non trovato automaticamente.'; return; }
    const warn = checkQuote(h, q);
    if (warn){
      run.why[h.id] = warn;
      // Precompila solo i prezzi in euro: un prezzo in dollari salvato per sbaglio falserebbe il valore.
      if (!q.currency || q.currency === 'EUR') run.sug[h.id] = { price:q.price, date:tradingDay(q.date || todayISO()) };
      return;
    }
    const before = (S.hist[h.id] || []).length;
    for (const [d, v] of q.history) addPoint(h.id, d, v);
    const Hn = S.hist[h.id], top = Hn[Hn.length - 1];
    if (!h.priceDate || top[0] >= h.priceDate){ h.price = top[1]; h.priceDate = top[0]; }
    h.feed = { symbol:q.symbol };
    const prev = prevPoint(Hn, top[0]);
    run.done.push({ h, sym:q.symbol, price:top[1], date:top[0], chg: prev ? top[1] / prev[1] - 1 : null, added: Hn.length - before });
    run.left.delete(h.id);
  };
  const queue = todo.slice();
  await Promise.all(Array.from({ length: Math.min(4, queue.length) }, async () => { while (queue.length) await step(queue.shift()); }));
  // Servizio non raggiungibile (per esempio app aperta fuori da Vercel): tutto a mano.
  if (todo.length && !got && fail) run.off = 'Aggiornamento automatico non disponibile: inserisci i prezzi a mano.';
  if (run.done.length){
    render();
    await Promise.all(run.done.map(x => store.saveHist(x.h.id)));
    store.savePortfolio();
    render();
  }
  if (auto === run && $('#autoProg')) bulkForm();
}
async function saveBulk(btn){
  const raw = $('#bDate').value || todayISO();
  if (raw > todayISO()){ $('#bErr').textContent = 'La data non può essere nel futuro.'; return; }
  const d = tradingDay(raw);
  const rows = [], bad = [], big = [];
  document.querySelectorAll('[data-bid]').forEach(inp => {
    if (!inp.value.trim()) return;
    const p = parseNum(inp.value), h = S.holdings.find(x => x.id === inp.dataset.bid);
    if (!(p > 0) || !h){ bad.push(h ? h.name : '?'); return; }
    const prev = parseFloat(inp.dataset.prev);
    if (prev > 0 && Math.abs(p / prev - 1) > 0.15) big.push(h.name);
    rows.push({ h, p });
  });
  if (bad.length){ $('#bErr').textContent = 'Prezzo non valido per: ' + bad.join(', '); return; }
  if (big.length && !btn.classList.contains('armed')){
    $('#bErr').textContent = 'Variazione superiore al 15% rispetto alla chiusura precedente per: ' + big.join(', ') + '. Controlla il prezzo; se è corretto premi di nuovo.';
    arm(btn, 'Conferma e salva'); return;
  }
  for (const { h, p } of rows){
    addPoint(h.id, d, p);
    if (!h.priceDate || d >= h.priceDate){ h.price = p; h.priceDate = d; }
  }
  closeDlg(); render();
  await Promise.all(rows.map(({ h }) => store.saveHist(h.id)));
  if (rows.length) store.savePortfolio();
  render();
}

  store.start((kind, data) => {
    if (kind === 'locked') return lockScreen();
    if (kind === 'portfolio'){ S.holdings = data; S.loaded = true; }
    else S.bench = data;
    if (S.loaded && !dlg.open) render();
    else if (S.loaded) render();
  });
})();
})();


</script>
